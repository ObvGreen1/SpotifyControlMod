# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Machine-specific settings (HTTP proxy, mirrors...) belong in the USER-level
# file at ~/.gradle/gradle.properties, never committed here.

# ---------------------------------------------------------------------------
# Shared mod properties (inherited by every sub-project)
# ---------------------------------------------------------------------------
mod_id=spotifycontrol
mod_name=Spotify Control
mod_version=1.0.1
maven_group=me.obvgreen
archives_base_name=spotifycontrol

# ---------------------------------------------------------------------------
# Toolchain
# Loom 1.18 requires Gradle 9.7+ and a Java 25 Gradle JVM. Each sub-project
# still compiles against its own Java level (21 for 1.21.x, 25 for 26.x).
# ---------------------------------------------------------------------------
loader_version=0.19.5
loom_version=1.18.4
