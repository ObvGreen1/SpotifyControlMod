name: Feature request
description: Suggest a new feature or improvement
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue. If a feature already exists, point that out — it may just be hidden
        in the config screen.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The scenario where the feature helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How you imagine the feature working. Config-settings, commands, keybinds?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds
      description: Anything you do today to get close to this behaviour.