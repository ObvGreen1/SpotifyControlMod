# Gradle daemon JVM criteria.
#
# Loom 1.18.4 requires a Java 25 JVM for Gradle itself. This is separate from the
# per-project Java toolchains (21 for the 1.21.x targets, 25 for the 26.x targets):
# Gradle *runs* on 25 and *compiles* each target with its own toolchain.
#
# Pinning the daemon here means a plain `./gradlew <task>` works no matter what the
# shell's default JAVA_HOME is. Gradle selects a locally installed JDK 25 if one is
# found (e.g. ~/.jdks); otherwise it reports a clear toolchain error rather than the
# low-level "JVM runtime version 25" failure.
toolchainVersion=25
