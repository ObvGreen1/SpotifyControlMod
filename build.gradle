// Root workspace. The real work happens in the sub-projects:
//   :common              shared, version-agnostic source + resources
//   :1.21.10 :1.21.11    obfuscated targets (official Mojang mappings + remap)
//   :26.1 :26.2 :26.3    deobfuscated targets (no mappings, no remap)

allprojects {
    group = rootProject.property('maven_group')
}

subprojects {
    repositories {
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases/'
        }
        maven {
            name = 'Shedaniel'
            url = 'https://maven.shedaniel.me/'
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
    }
}

// Convenience aggregate: `./gradlew buildAll` builds every target version.
// (`./gradlew build` already builds all sub-projects with a `build` task.)
tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every target Minecraft version JAR.'
    dependsOn subprojects
            .findAll { it.name != 'common' }
            .collect { "${it.path}:build" }
}
