# Target Minecraft 26.2 (deobfuscated; no mappings, no remap).
minecraft_version=26.2
loom_plugin_id=net.fabricmc.fabric-loom
java_version=25

# Compile the shared sources through the 26.x API rewrite (GuiGraphicsExtractor,
# HudElementRegistry, ClientCommands, KeyMappingHelper, InputConstants keys, ...).
uses_26_api=true

fabric_api_version=0.161.0+26.2
modmenu_version=20.0.3
cloth_config_version=26.2.155

# fabric.mod.json mod metadata ranges
minecraft_range=>=26.2 <26.3
modmenu_range=>=20.0.0
cloth_range=>=26.2.0

# Fabric module that owns the keybind helper (renamed from fabric-key-binding-api-v1).
keybinding_module=fabric-key-mapping-api-v1
