# Target Minecraft 1.21.10 (obfuscated; official Mojang mappings + remap).
minecraft_version=1.21.10
loom_plugin_id=net.fabricmc.fabric-loom-remap
java_version=21

# 1.21.10 predates the official ResourceLocation -> Identifier rename.
uses_resource_location=true

fabric_api_version=0.138.4+1.21.10
modmenu_version=16.0.1
cloth_config_version=20.0.149

# fabric.mod.json mod metadata ranges
minecraft_range=>=1.21.10 <1.21.11
modmenu_range=>=16.0.0
cloth_range=>=20.0.0

# Fabric module that owns the keybind helper (renamed to fabric-key-mapping-api-v1 in 26.x).
keybinding_module=fabric-key-binding-api-v1
